{% extends "base.html" %}
{% block title %}Cadastro{% endblock %}
{% block content %}
<div class="card">
  <h1>Criar conta</h1>
  <p class="subtitle">Preencha seus dados para se cadastrar</p>
  <form method="POST" action="/register" id="form-register">
    <div class="row">
      <div class="field">
        <label for="first_name">Nome</label>
        <input type="text" id="first_name" name="first_name" placeholder="João">
      </div>
      <div class="field">
        <label for="last_name">Sobrenome</label>
        <input type="text" id="last_name" name="last_name" placeholder="Silva">
      </div>
    </div>
    <div class="field">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="joao@exemplo.com">
    </div>
    <div class="field">
      <label for="cpf">CPF</label>
      <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14">
    </div>
    <div class="field">
      <label for="birthdate">Data de nascimento</label>
      <input type="date" id="birthdate" name="birthdate">
    </div>
    <div class="field">
      <label for="phone">Telefone</label>
      <input type="tel" id="phone" name="phone" placeholder="(21) 99999-0000">
    </div>
    <hr class="divider">
    <div class="field">
      <label for="password">Senha</label>
      <input type="password" id="password" name="password" placeholder="mínimo 8 caracteres">
    </div>
    <div class="field">
      <label for="password_confirm">Confirmar senha</label>
      <input type="password" id="password_confirm" name="password_confirm" placeholder="repita a senha">
    </div>
    <div class="field">
      <label>Gênero</label>
      <div class="radio-group">
        <label class="radio-item"><input type="radio" name="gender" value="M"> Masculino</label>
        <label class="radio-item"><input type="radio" name="gender" value="F"> Feminino</label>
        <label class="radio-item"><input type="radio" name="gender" value="O"> Outro</label>
      </div>
    </div>
    <div class="field">
      <label>Interesses</label>
      <div class="checkbox-group">
        <label class="checkbox-item"><input type="checkbox" name="interests" value="tech"> Tecnologia</label>
        <label class="checkbox-item"><input type="checkbox" name="interests" value="sports"> Esportes</label>
        <label class="checkbox-item"><input type="checkbox" name="interests" value="fashion"> Moda</label>
        <label class="checkbox-item"><input type="checkbox" name="interests" value="games"> Games</label>
      </div>
    </div>
    <button type="submit">Criar conta</button>
  </form>
</div>
{% endblock %}
