{% extends "base.html" %}
{% block title %}Perfil{% endblock %}
{% block content %}
<div class="card">
  <h1>Editar perfil</h1>
  <p class="subtitle">Atualize suas informações pessoais</p>
  <form method="POST" action="/profile" id="form-profile">
    <div class="section-label">Dados pessoais</div>
    <div class="row">
      <div class="field">
        <label for="first_name">Nome</label>
        <input type="text" id="first_name" name="first_name" value="João">
      </div>
      <div class="field">
        <label for="last_name">Sobrenome</label>
        <input type="text" id="last_name" name="last_name" value="Silva">
      </div>
    </div>
    <div class="field">
      <label for="username">Nome de usuário</label>
      <input type="text" id="username" name="username" value="joaosilva42">
    </div>
    <div class="field">
      <label for="bio">Bio</label>
      <textarea id="bio" name="bio" style="min-height:70px">Apaixonado por tecnologia e esportes.</textarea>
    </div>
    <div class="field">
      <label for="website">Website</label>
      <input type="text" id="website" name="website" placeholder="https://meusite.com.br">
    </div>
    <hr class="divider">
    <div class="section-label">Endereço</div>
    <div class="field">
      <label for="cep">CEP</label>
      <input type="text" id="cep" name="cep" placeholder="00000-000" maxlength="9">
    </div>
    <div class="row">
      <div class="field">
        <label for="street">Rua</label>
        <input type="text" id="street" name="street" placeholder="Av. Paulista">
      </div>
      <div class="field">
        <label for="number">Número</label>
        <input type="text" id="number" name="number" placeholder="1000">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="city">Cidade</label>
        <input type="text" id="city" name="city" placeholder="São Paulo">
      </div>
      <div class="field">
        <label for="state">Estado</label>
        <select id="state" name="state">
          <option value="SP">SP</option><option value="RJ">RJ</option>
          <option value="MG">MG</option><option value="RS">RS</option>
          <option value="PR">PR</option><option value="SC">SC</option>
          <option value="BA">BA</option><option value="GO">GO</option>
          <option value="DF">DF</option><option value="PE">PE</option>
          <option value="CE">CE</option><option value="PA">PA</option>
          <option value="MA">MA</option><option value="AL">AL</option>
          <option value="RN">RN</option><option value="PB">PB</option>
          <option value="PI">PI</option><option value="MS">MS</option>
          <option value="SE">SE</option><option value="AP">AP</option>
        </select>
      </div>
    </div>
    <hr class="divider">
    <div class="section-label">Preferências</div>
    <div class="field">
      <label for="language">Idioma</label>
      <select id="language" name="language">
        <option value="pt-BR" selected>Português (Brasil)</option>
        <option value="en-US">English (US)</option>
        <option value="es">Español</option>
      </select>
    </div>
    <div class="field">
      <label>Notificações</label>
      <div class="checkbox-group">
        <label class="checkbox-item"><input type="checkbox" name="notif" value="email" checked> E-mail</label>
        <label class="checkbox-item"><input type="checkbox" name="notif" value="push"> Push</label>
        <label class="checkbox-item"><input type="checkbox" name="notif" value="sms"> SMS</label>
      </div>
    </div>
    <button type="submit">Salvar alterações</button>
  </form>
</div>
{% endblock %}
