<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Forms{% endblock %} — Dataset</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f5f4f0;
      --surface:  #ffffff;
      --border:   #d8d6cf;
      --text:     #1a1917;
      --muted:    #72706a;
      --accent:   #1a1917;
      --focus:    #3b5bdb;
      --radius:   4px;
      --mono:     'IBM Plex Mono', monospace;
      --sans:     'IBM Plex Sans', sans-serif;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      background: var(--surface);
    }

    header a { text-decoration: none; color: inherit; }
    header .logo {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .04em;
      color: var(--muted);
    }
    header .logo span { color: var(--text); }

    nav { display: flex; gap: .25rem; flex-wrap: wrap; }
    nav a {
      font-size: 12px;
      font-family: var(--mono);
      padding: 4px 10px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      color: var(--muted);
      text-decoration: none;
      transition: all .15s;
    }
    nav a:hover { border-color: var(--border); color: var(--text); }
    nav a.active { border-color: var(--border); color: var(--text); background: var(--bg); }

    main {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 3rem 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem 2.5rem;
      width: 100%;
      max-width: 480px;
    }

    .card-wide { max-width: 640px; }

    h1 {
      font-size: 17px;
      font-weight: 500;
      margin-bottom: .25rem;
    }
    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 1.75rem;
    }

    .field { margin-bottom: 1.1rem; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      font-family: var(--mono);
      color: var(--muted);
      margin-bottom: .35rem;
      letter-spacing: .03em;
      text-transform: uppercase;
    }

    input[type=text],
    input[type=email],
    input[type=password],
    input[type=number],
    input[type=tel],
    input[type=date],
    select,
    textarea {
      width: 100%;
      padding: .55rem .75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: var(--sans);
      font-size: 14px;
      color: var(--text);
      background: var(--surface);
      outline: none;
      transition: border-color .15s;
      appearance: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px rgba(59,91,219,.1);
    }

    textarea { resize: vertical; min-height: 90px; }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }

    .checkbox-group { display: flex; flex-direction: column; gap: .4rem; }
    .checkbox-item { display: flex; align-items: center; gap: .5rem; font-size: 14px; cursor: pointer; }
    .checkbox-item input { width: auto; }

    .radio-group { display: flex; gap: 1rem; flex-wrap: wrap; }
    .radio-item { display: flex; align-items: center; gap: .4rem; font-size: 14px; cursor: pointer; }
    .radio-item input { width: auto; }

    .range-row { display: flex; align-items: center; gap: .75rem; }
    .range-row input { flex: 1; }
    .range-val { font-family: var(--mono); font-size: 13px; color: var(--muted); min-width: 48px; }

    button[type=submit] {
      width: 100%;
      margin-top: 1.5rem;
      padding: .65rem 1rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .04em;
      cursor: pointer;
      transition: opacity .15s;
    }
    button[type=submit]:hover { opacity: .85; }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.25rem 0;
    }

    .section-label {
      font-size: 11px;
      font-family: var(--mono);
      font-weight: 500;
      color: var(--muted);
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-bottom: .75rem;
    }
  </style>
</head>
<body>
<header>
  <a href="/"><span class="logo"><span>honeypot</span>/dataset</span></a>
  <nav>
    <a href="/login"    {% if request.path == '/login'    %}class="active"{% endif %}>login</a>
    <a href="/register" {% if request.path == '/register' %}class="active"{% endif %}>register</a>
    <a href="/search"   {% if request.path == '/search'   %}class="active"{% endif %}>search</a>
    <a href="/contact"  {% if request.path == '/contact'  %}class="active"{% endif %}>contact</a>
    <a href="/profile"  {% if request.path == '/profile'  %}class="active"{% endif %}>profile</a>
    <a href="/checkout" {% if request.path == '/checkout' %}class="active"{% endif %}>checkout</a>
    <a href="/comment"  {% if request.path == '/comment'  %}class="active"{% endif %}>comment</a>
    <a href="/products" {% if request.path == '/products' %}class="active"{% endif %}>products</a>
  </nav>
</header>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
